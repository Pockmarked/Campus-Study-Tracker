services:
  # ----------------------------------------------------------------------------
  # Service 1: Application (Node.js Express + Web UI)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campus-study-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-campus_study_db}
      - DB_USER=${POSTGRES_USER:-study_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-StudySecurePass2026!}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - campus_frontend_net
      - campus_backend_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Service 2: Database (PostgreSQL 16 Alpine)
  # Port 5432 sengaja TIDAK dipublikasikan ke host (Internal Backend Security)
  # ----------------------------------------------------------------------------
  database:
    image: postgres:16-alpine
    container_name: campus-study-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campus_study_db}
      POSTGRES_USER: ${POSTGRES_USER:-study_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StudySecurePass2026!}
    volumes:
      - study_postgres_data:/var/lib/postgresql/data
    networks:
      - campus_backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-study_user} -d ${POSTGRES_DB:-campus_study_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Service 3 (Optional profile): Test Runner untuk CI/CD dan Automated Testing
  # ----------------------------------------------------------------------------
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campus-study-test-runner
    profiles: ["test"]
    environment:
      - NODE_ENV=test
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-campus_study_db}
      - DB_USER=${POSTGRES_USER:-study_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-StudySecurePass2026!}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - campus_backend_net
    command: ["npm", "test"]

# ------------------------------------------------------------------------------
# Persistent Volume Definition
# Data sesi belajar tetap tersimpan aman saat container di-restart atau di-recreate
# ------------------------------------------------------------------------------
volumes:
  study_postgres_data:
    name: campus_study_postgres_data
    driver: local

# ------------------------------------------------------------------------------
# Network Topology Definition (Network Segmentation)
# campus_frontend_net: Bridge publik untuk traffic web client
# campus_backend_net : Jaringan terisolasi (internal: true) khusus app dan DB
# ------------------------------------------------------------------------------
networks:
  campus_frontend_net:
    name: campus_study_frontend_net
    driver: bridge
  campus_backend_net:
    name: campus_study_backend_net
    driver: bridge
    internal: true
